<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Hunter - IA Classifier</title>
    <!-- TensorFlow.js y MobileNet -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1"></script>
    <style>
        body {
            background-color: #121214;
            color: #d4d4d8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
            background-image: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), url('fondo-mh.jpg');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(24, 24, 27, 0.9);
            border: 2px solid #b45309;
            /* Tono bronce/fuego */
            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(180, 83, 9, 0.3);
        }

        h2 {
            color: #f59e0b;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        p {
            color: #a1a1aa;
            font-size: 0.95em;
        }

        input[type="file"] {
            margin: 20px 0;
            color: #f59e0b;
        }

        .img-container {
            min-height: 200px;
            border: 2px dashed #3f3f46;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            overflow: hidden;
            background: #09090b;
            position: relative;
        }

        #placeholder-text {
            color: #52525b;
            position: absolute;
        }

        img {
            max-width: 100%;
            max-height: 300px;
            display: none;
            border-radius: 4px;
            position: relative;
            z-index: 2;
        }

        #resultado {
            font-weight: bold;
            color: #38bdf8;
            font-size: 1.1em;
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>The Guild Research Lab</h2>
        <p>Sube una captura de un monstruo, arma o material de Monster Hunter para analizarlo:</p>

        <input type="file" id="subirImagen" accept="image/*">

        <div class="img-container">
            <span id="placeholder-text">Esperando especímen...</span>
            <img id="imagenPrevia" src="" alt="Monstruo o item">
        </div>

        <p id="resultado">Iniciando protocolo de la Comisión de Investigación...</p>
    </div>

    <script src="script.js"></script>
</body>

</html>
